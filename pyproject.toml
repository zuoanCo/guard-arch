[project]
name = "guard-arch"
version = "0.1.0"
description = "Guard Arch: a Claude Code-style agent CLI built on a self-hosted Agent Runtime over PydanticAI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=1.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guard_arch"]

[project.scripts]
guard = "guard_arch.cli:main"
guard-api = "guard_arch.api.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
